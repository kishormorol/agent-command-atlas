    <meta name="description" content="SEATBELT_PROFILE for Gemini CLI: Switches the Seatbelt (sandbox-exec) profile on macOS. permissive-open: (Default) Denies operations by default, confining writes to the project folder (and a few other folders, see packages/cli/src/utils/sandbox-macos-permissive-open.sb) while allowing broad file reads and network access. restrictive-open: Declines operations by default, allows network. strict-open: Restricts both reads and writes to the working directory, allows network. strict-proxied: Same as strict-open but routes network through proxy. : Uses a custom profile. To define a custom profile, create a file named sandbox-macos-.sb in your project&#x27;s .gemini/ directory (for example, my-project/.gemini/sandbox-macos-custom.sb). DEBUG or DEBUG_MODE (often used by underlying libraries or the CLI itself): Set to true or 1 to enable verbose debug logging, which can be helpful for troubleshooting. Note: These variables are automatically excluded from project .env files by default to prevent interference with gemini-cli behavior. Use .gemini/.env files if you need to set these for gemini-cli specifically.">
