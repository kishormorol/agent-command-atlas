    <meta name="description" content="GOOGLE_CLOUD_PROJECT for Gemini CLI: Your Google Cloud Project ID. Required for using Code Assist or Vertex AI. If using Vertex AI, ensure you have the necessary permissions in this project. Cloud Shell note: When running in a Cloud Shell environment, this variable defaults to a special project allocated for Cloud Shell users. If you have GOOGLE_CLOUD_PROJECT set in your global environment in Cloud Shell, it will be overridden by this default. To use a different project in Cloud Shell, you must define GOOGLE_CLOUD_PROJECT in a .env file. Example: export GOOGLE_CLOUD_PROJECT=&quot;YOUR_PROJECT_ID&quot; (Windows PowerShell: $env:GOOGLE_CLOUD_PROJECT=&quot;YOUR_PROJECT_ID&quot;).">
