    <meta name="description" content="CLAUDE_CODE_TMUX_TRUECOLOR for Claude Code: Set to any non-empty value, such as 1, to allow 24-bit truecolor output inside tmux. Setting it to 0 or false still allows truecolor, unlike most on/off variables; unset the variable to restore the 256-color clamp. By default, Claude Code clamps to 256 colors when $TMUX is set because tmux does not pass through truecolor escape sequences unless configured to. Set this after adding set -ga terminal-overrides &#x27;,*:Tc&#x27; to your ~/.tmux.conf. See Terminal configuration for other tmux settings">
