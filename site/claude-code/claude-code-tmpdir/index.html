    <meta name="description" content="CLAUDE_CODE_TMPDIR for Claude Code: Override the temp directory used for internal temp files. Claude Code appends /claude-{uid}/ on Unix or /claude/ on Windows to this path. Default: /tmp on macOS, os.tmpdir() on Linux and Windows. As of v2.1.161, on macOS and Linux, sandboxed Bash subprocesses receive a short fallback $TMPDIR under the system default when your override is a long path, since some tools fail when temp paths get too long. Unsandboxed Bash commands inherit your shell&#x27;s $TMPDIR unchanged. Claude Code&#x27;s own temp files always use your override">
