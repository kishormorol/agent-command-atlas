    <meta name="description" content="CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST for Claude Code: Set by host platforms that embed Claude Code and manage model provider routing on its behalf. When set, Claude Code ignores provider-selection, endpoint, and authentication variables such as CLAUDE_CODE_USE_BEDROCK, ANTHROPIC_BASE_URL, and ANTHROPIC_API_KEY in settings files, so user settings can&#x27;t override the host&#x27;s routing. Claude Code also ignores model-selection keys such as model, fallbackModel, and modelOverrides in managed settings, whichever managed source delivers them, so the host&#x27;s model configuration takes precedence over an out-of-date managed model pin. Claude Code also ignores model-selection variables such as ANTHROPIC_MODEL and the ANTHROPIC_DEFAULT_*_MODEL family in a managed env block; an availableModels allowlist in managed settings still applies unless the host supplies its own. Claude Code also skips the automatic telemetry opt-out it otherwise applies on third-party providers such as Amazon Bedrock, Claude Platform on AWS, Google Cloud&#x27;s Agent Platform, and Microsoft Foundry, so telemetry follows the standard DISABLE_TELEMETRY opt-out. See Default behaviors by API provider">
