    <meta name="description" content="disableCommandPluginSources for Claude Code: Block the command plugin source, which installs a plugin by running a marketplace-declared command on the user&#x27;s machine. When you set it to true, Claude Code never runs the command, doesn&#x27;t install or update command-sourced plugins, and stops loading the ones already installed. Set it to false to allow them explicitly. Whenever it blocks command sources, whether you set it to true or leave it unset under allowManagedHooksOnly, it also blocks marketplace headersHelper commands, except for a marketplace that managed settings themselves declare. Requires Claude Code v2.1.229 or later, and the headersHelper block requires v2.1.238 or later.">
