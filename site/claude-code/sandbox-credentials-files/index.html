    <meta name="description" content="sandbox.credentials.files for Claude Code: Protect credential files or directories from sandboxed commands. With &quot;mode&quot;: &quot;deny&quot;, Claude Code blocks reads of the path inside the sandbox, the same read block as sandbox.filesystem.denyRead. With &quot;mode&quot;: &quot;mask&quot;, sandboxed commands on Linux and WSL2 read a sentinel copy of the file, and the sandbox proxy substitutes the real value on outbound requests to that entry&#x27;s injectHosts; on macOS the file is unreadable inside the sandbox instead. Requires Claude Code v2.1.187 or later, and &quot;mode&quot;: &quot;mask&quot; requires v2.1.221 or later.">
