    <meta name="description" content="CLAUDE_CODE_MESSAGING_TOKEN for Claude Code: Set by Claude Code, not by you: in sessions that bind an inbox socket, Claude Code exports this per-session token to hooks and Bash commands alongside CLAUDE_CODE_MESSAGING_SOCKET. A script posting to the socket can send {&quot;type&quot;:&quot;auth&quot;,&quot;token&quot;:&quot;&quot;} as its first line to prove it belongs to the session. On native Windows, Claude Code requires this line and closes any connection that doesn&#x27;t open with a valid one. The own-child rules say when Claude Code consults the token. Each session exports its own token, never one inherited from a parent session. Settings env blocks can&#x27;t set it. Requires Claude Code v2.1.228 or later">
