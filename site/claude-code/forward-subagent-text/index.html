    <meta name="description" content="--forward-subagent-text for Claude Code: Emit subagent text and thinking blocks in the output stream as assistant and user messages with parent_tool_use_id set, so you can reconstruct each subagent&#x27;s transcript. Without this flag, Claude Code emits only subagent tool_use and tool_result blocks. Requires --print and --output-format stream-json. Claude Code also forwards messages from nested subagents, setting parent_tool_use_id to the ID of the Agent tool call that spawned each one; this requires Claude Code v2.1.219 or later. The CLAUDE_CODE_FORWARD_SUBAGENT_TEXT environment variable enables the same behavior. Requires Claude Code v2.1.211 or later">
