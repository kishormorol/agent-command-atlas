    <meta name="description" content="CLAUDE_CODE_MESSAGING_SOCKET for Claude Code: Set by Claude Code, not by you: in sessions that bind an inbox socket, Claude Code exports that socket&#x27;s path to hooks and Bash commands when it binds the socket. In a session that starts with messaging on, Claude Code binds the socket before any hook runs. Other sessions on the machine deliver messages to this path. Each session exports its own socket rather than one inherited from a parent, and messages arriving on it go through the session&#x27;s inbound controls. Settings env blocks can&#x27;t set it. Requires Claude Code v2.1.224 or later">
